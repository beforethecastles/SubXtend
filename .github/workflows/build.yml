name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test DSP
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: SubXtend-${{ matrix.name }}
          path: |
            build/SubXtend_artefacts/Release/VST3
            build/SubXtend_artefacts/Release/AU
            build/SubXtend_artefacts/Release/Standalone
